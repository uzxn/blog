# ============================================================
#  站点基础信息
# ============================================================
site_name: uzxn's Weblog
site_description: Something Interesting
site_author: uzxn
site_url: https://uzxn.github.io/blog/ # 部署后的域名，本地预览可忽略

# 仓库链接（右上角图标），不需要可整段删除
repo_url: https://github.com/uzxn/blog/
repo_name: uzxn/blog
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 uzxn

# ============================================================
#  主题
# ============================================================
theme:
  name: material
  language: zh # 中文界面
  icon:
    logo: material/notebook-outline
    repo: fontawesome/brands/github
  font: false # 关闭 Google Fonts，改用系统字体（国内访问更快）
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 跟随系统
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

# ============================================================
#  插件
# ============================================================
plugins:
  - search:
      lang:
        - zh
        - en
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: full
      post_url_date_format: yyyy/MM/dd
      post_url_format: "{date}/{slug}" # 文章 URL：博客/2026/10/11/xxx
      archive: true
      archive_name: 归档
      authors: true
      authors_file: blog/.authors.yml
      pagination_per_page: 10
      post_excerpt: required # 列表页只显示摘要，每篇文章必须含 <!-- more -->
      post_excerpt_separator: "<!-- more -->" # 摘要截断标记
  - tags # 标签索引页在 docs/tags.md 中用 <!-- material/tags --> 声明
  # 社交卡片（自动生成分享图）需要额外依赖，开启前先安装：
  # pip install "mkdocs-material[imaging]"
  # - social:
  #     cards_layout_options:
  #       background_color: "#4051b5"

# ============================================================
#  Markdown 扩展
# ============================================================
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex: # 数学公式：行内 $...$ / 块级 $$...$$
      generic: true # 输出 <span class="arithmatex">，交给 KaTeX 在浏览器渲染
      inline_syntax:
        - dollar
      block_syntax:
        - dollar
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.emoji: # 图标短代码：:material-xxx: / :octicons-xxx:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# ============================================================
#  页面导航
# ============================================================
nav:
  - 首页: index.md
  - 博客:
      - blog/index.md
  - 标签: tags.md
  - 关于: about.md

# ============================================================
#  资源与附加配置
# ============================================================
extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0.19.0/dist/katex.min.js
  - https://unpkg.com/katex@0.19.0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0.19.0/dist/katex.min.css
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/uzxn/
      name: GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:hzx@hrbeu.edu.cn
      name: 邮箱
